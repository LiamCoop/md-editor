services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=md_editor
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pg-data:/var/lib/postgresql/data

  sync-server:
    image: ghcr.io/automerge/automerge-repo-sync-server:main
    ports:
      - "3030:3030"
    volumes:
      - sync-data:/data
    environment:
      - PORT=3030
      - DATA_DIR=/data

